# La structure du catalogue: le domaine, les familles, l'équipe, les ressources.
#
# Les fiches des dépôts renvoient à une famille (un système), à un propriétaire
# et à des ressources. Si ces fiches-là n'existent pas, le portail affiche des
# liens cassés et personne ne comprend pourquoi. Ce fichier les déclare, une
# fois pour tous les dépôts.
#
# Il vit dans le portail, et non dans un dépôt de composant: il ne décrit aucun
# dépôt en particulier, mais la façon dont tous se rangent.

# --- Le domaine: tout le projet -----------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: oscar
  title: OSCAR
  description: >-
    La plateforme robotique OSCAR, vendue à des entreprises. Elle relie des
    personnes, des logiciels et des robots: piloter un robot à distance, depuis
    un écran ou un casque, et suivre son exploitation.
  links:
    - url: https://github.com/oscar-organisation
      title: L'organisation sur GitHub
      icon: github
spec:
  owner: group:default/equipe-oscar

---
# --- Les familles de dépôts: un système par famille ---------------------------
#
# Le rangement suit la carte des dépôts du projet (_pilotage/07-carte-des-depots.md):
#   plateforme      oscar-platform
#   console         oscar-console-admin
#   infrastructure  oscar-infrastructure
#   outillage       oscar-tools, oscar-integrator
#   verification    oscar-test, oscar-simulation
#   gouvernance     oscar-general-gouvernance-project, oscar-docs-officiel,
#                   oscar-skill-gouvernance-dev-agents,
#                   oscar-gestion-incidents-and-reports
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: plateforme
  title: Plateforme
  description: >-
    Ce qui appartient à OSCAR et n'est jamais installé chez un client: le
    portail où le client suit son dossier, et celui où l'équipe émet les
    licences.
spec:
  owner: group:default/equipe-oscar
  domain: oscar

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: console
  title: Console du client
  description: >-
    L'outil de travail quotidien du client, installable chez lui. Il porte la
    téléopération, le studio et l'administration.
spec:
  owner: group:default/equipe-oscar
  domain: oscar

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: infrastructure
  title: Infrastructure
  description: >-
    Les briques techniques partagées: les noms de domaine, le transport de la
    vidéo en temps réel, le déploiement, l'entrepôt des images (Harbor) et le
    réseau privé des robots (WireGuard).
spec:
  owner: group:default/equipe-oscar
  domain: oscar

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: outillage
  title: Outillage
  description: >-
    Ce qui sert à construire et à faire tourner le reste, y compris ce qu'on
    remet aux intégrateurs.
spec:
  owner: group:default/equipe-oscar
  domain: oscar

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: verification
  title: Vérification
  description: >-
    Tester les applications, et simuler un robot pour les vérifier sans
    machine physique.
spec:
  owner: group:default/equipe-oscar
  domain: oscar

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: gouvernance
  title: Gouvernance
  description: >-
    Le point d'entrée du projet et son guide, la documentation, les incidents,
    et la façon dont on fait travailler les agents de développement.
spec:
  owner: group:default/equipe-oscar
  domain: oscar

---
# --- L'équipe -------------------------------------------------------------------
#
# Les personnes viennent de l'organisation GitHub et arrivent toutes seules, en
# test et en production. Cette équipe existe pour que chaque fiche ait un
# propriétaire dès le premier jour: une fiche sans propriétaire est une fiche
# que personne ne réclame.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: equipe-oscar
  title: Équipe OSCAR
  description: Le propriétaire de toutes les fiches, en attendant des équipes plus fines.
spec:
  type: team
  children: []

---
# --- Les ressources: ce dont les applications ont besoin pour tourner -------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: coolify
  title: Coolify
  description: >-
    L'outil qui lance les applications sur le serveur, à la demande des
    vérifications automatiques de GitHub de chaque dépôt, une fois qu'elles
    ont réussi. Depuis le 4 octobre 2026, il ne construit plus: il télécharge
    dans Harbor l'image désignée et la lance, en test puis la même en
    production. Un projet par application, deux environnements, test et
    production.
  links:
    - url: https://deploy.oscar-bot.com
      title: Coolify
      icon: dashboard
spec:
  type: plateforme-de-deploiement
  owner: group:default/equipe-oscar
  system: infrastructure
  # Harbor, l'entrepôt des images, a sa fiche dans le dépôt
  # oscar-infrastructure (oscar_infra_container_registry/catalog-info.yaml).
  dependsOn:
    - resource:default/proxy
    - resource:default/entrepot-images

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: proxy
  title: Le proxy du serveur
  description: >-
    Traefik, installé et réglé par Coolify. Il reçoit les visiteurs sur les
    ports 80 et 443, obtient les certificats, et envoie chaque adresse vers la
    bonne application. Il refuse les noms qu'il ne connaît pas.
spec:
  type: proxy
  owner: group:default/equipe-oscar
  system: infrastructure

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ovhcloud
  title: OVHcloud
  description: >-
    Le fournisseur du nom de domaine oscar-bot.com et de sa zone DNS. Le nom
    générique *.oscar-bot.com mène au serveur: une nouvelle adresse ne demande
    aucun enregistrement.
  links:
    - url: https://www.ovh.com/manager/
      title: L'espace client OVHcloud
      icon: dashboard
spec:
  type: fournisseur-de-domaine
  owner: group:default/equipe-oscar
  system: infrastructure
