# Les fiches du dépôt oscar-infrastructure, lues par le portail technique.
#
# Place définitive: à la racine du dépôt oscar-infrastructure, où le portail
# cherche une fiche dans chaque dépôt de l'organisation. Elle remplace la fiche
# d'avant, qui décrivait le dépôt entier comme un seul composant.
#
# Chaque unité qui se déploie seule a sa propre fiche, dans son propre dossier
# (décision 62). Celle-ci ne fait que les nommer: une unité ajoutée demain
# demande une ligne de plus ici.

apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: oscar-infrastructure
  description: Les unités du dépôt oscar-infrastructure, chacune dans son dossier.
spec:
  targets:
    - ./oscar_infra_dns/catalog-info.yaml
    - ./oscar_infra_realtime_server/catalog-info.yaml
