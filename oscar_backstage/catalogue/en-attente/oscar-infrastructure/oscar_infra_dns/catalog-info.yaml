# La fiche de l'outil DNS, lue par le portail technique.
#
# Place définitive: oscar-infrastructure/oscar_infra_dns/catalog-info.yaml, dans
# le dossier de l'outil, qui le contient tout entier (décision 62). Le fichier
# catalog-info.yaml à la racine du dépôt y renvoie.

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: outil-dns
  title: Outil DNS
  description: >-
    Gère les noms de domaine et leurs enregistrements, chez plusieurs
    fournisseurs, par une API et une interface web. Il garde une trace de tout,
    et vérifie qu'un changement est bien visible.
  annotations:
    # L'état de la chaîne, lu dans GitHub Actions.
    github.com/project-slug: oscar-organisation/oscar-infrastructure
    backstage.io/source-location: url:https://github.com/oscar-organisation/oscar-infrastructure/tree/main/oscar_infra_dns/
  tags:
    - dns
    - python
    - nextjs
  links:
    - url: https://dns.oscar-bot.com
      title: Production, l'interface
    - url: https://api-dns.oscar-bot.com/v1/health
      title: Production, la santé de l'API
    - url: https://test-dns.oscar-bot.com
      title: Test, l'interface
    - url: https://test-api-dns.oscar-bot.com/v1/health
      title: Test, la santé de l'API
    - url: https://deploy.oscar-bot.com/project/mb91fysc4xlkdzgbhzsmtbv7/environment/hozdqdrqmanixsol1rnqvynk
      title: Coolify, la production
    - url: https://deploy.oscar-bot.com/project/mb91fysc4xlkdzgbhzsmtbv7/environment/dy1cpgek8jhf2zjchg5ixutl
      title: Coolify, le test
    - url: https://github.com/oscar-organisation/oscar-infrastructure/tree/main/oscar_infra_dns
      title: Le code
      icon: github
    - url: https://github.com/oscar-organisation/oscar-infrastructure/actions
      title: La chaîne
      icon: github
    - url: https://labo.oscar-bot.com
      title: Les rapports du laboratoire, production
    - url: https://test-labo.oscar-bot.com
      title: Les rapports du laboratoire, test
spec:
  type: service
  lifecycle: production
  owner: group:default/equipe-oscar
  system: infrastructure
  providesApis:
    - api:default/outil-dns-api
  dependsOn:
    - resource:default/coolify
    - resource:default/proxy
    - resource:default/ovhcloud

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: outil-dns-api
  title: API de l'outil DNS
  description: >-
    L'API publique de l'outil DNS. L'interface web ne passe que par elle. Sa
    description est celle que l'API de production publie elle-même.
  links:
    - url: https://api-dns.oscar-bot.com/docs
      title: La description, servie par l'API
spec:
  type: openapi
  lifecycle: production
  owner: group:default/equipe-oscar
  system: infrastructure
  definition:
    # Lue à chaque rafraîchissement du catalogue: la description affichée est
    # toujours celle de l'API en service, jamais une copie qui vieillit.
    $text: https://api-dns.oscar-bot.com/openapi.json
