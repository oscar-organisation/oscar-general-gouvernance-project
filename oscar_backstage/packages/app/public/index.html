<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- La couleur de la barre du navigateur sur telephone: le Noir OSCAR. -->
    <meta name="theme-color" content="#1B1D1E" />
    <meta
      name="description"
      content="OSCAR, le portail technique : les applications, les depots et le guide du cycle de developpement."
    />
    <link
      rel="manifest"
      href="<%= publicPath %>/manifest.json"
      crossorigin="use-credentials"
    />
    <!-- Les icones sont fabriquees depuis le symbole officiel: marque/LISEZ-MOI.md -->
    <link rel="icon" href="<%= publicPath %>/favicon.ico?v=429924f3631d" sizes="48x48" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= publicPath %>/favicon-32x32.png?v=b096322c7302"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= publicPath %>/favicon-16x16.png?v=478c9f0be857"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= publicPath %>/apple-touch-icon.png"
    />
    <title><%= config.getString('app.title') %></title>
  </head>
  <body>
    <noscript>Le portail OSCAR a besoin de JavaScript pour s'afficher.</noscript>
    <div id="root"></div>
  </body>
</html>
