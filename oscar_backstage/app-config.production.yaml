# En test et en production: la connexion par GitHub, et le catalogue lu dans
# l organisation GitHub.
#
# Lu apres app-config.yaml et app-config.service.yaml, par la commande de
# l image (Dockerfile). Les identifiants de l application GitHub viennent des
# variables de l application Coolify, posees depuis secret_root/; aucun n est
# ecrit ici. S il en manque un, Backstage refuse de demarrer en le nommant.

# -----------------------------------------------------------------------------
# QUI PEUT ENTRER
#
# Par GitHub, et seulement par GitHub: la page de connexion ne propose rien
# d autre, et l acces invite n est pas configure. Le compte GitHub doit
# correspondre a une personne du catalogue, c est-a-dire a un membre de
# l organisation oscar-organisation, importe plus bas. Un compte GitHub hors de
# l organisation est refuse.
# -----------------------------------------------------------------------------
auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # Le nom du compte GitHub doit etre celui d une personne du
            # catalogue: c est l import de l organisation qui les cree, une par
            # membre, sous leur nom GitHub.
            - resolver: usernameMatchingUserEntityName

# -----------------------------------------------------------------------------
# L ACCES A GITHUB
#
# Une application GitHub plutot qu un jeton personnel: ses droits sont choisis
# un par un, son acces se renouvelle tout seul, et elle ne depend du compte de
# personne. La meme sert en test et en production (decision 64).
# -----------------------------------------------------------------------------
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_CLIENT_ID}
          clientSecret: ${GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}

# -----------------------------------------------------------------------------
# CE QUI REMPLIT LE CATALOGUE
#
#   la structure (domaine, familles, ressources, equipe), et les fiches des
#   depots qui ne portent pas encore la leur: dans l image, dossier catalogue/
#   les fiches catalog-info.yaml que les depots portent eux-memes, sur main:
#   trouvees seules, un depot cree demain apparait sans rien changer ici
#   les personnes et les equipes de l organisation GitHub
# -----------------------------------------------------------------------------
catalog:
  # Cette liste est aussi dans app-config.poste.yaml, avec en plus le depot du
  # poste: une liste ne se complete pas d un fichier a l autre, elle se
  # remplace. Un test verifie que les deux commencent par les memes lignes.
  locations:
    - type: file
      target: /app/catalogue/organisation.yaml
      rules:
        - allow: [Domain, System, Group, Resource]
    - type: file
      target: /app/catalogue/en-attente/*/catalog-info.yaml
      rules:
        - allow: [Component, API, Location]

  providers:
    github:
      oscarOrganisation:
        organization: oscar-organisation
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }

    githubOrg:
      - id: oscar
        githubUrl: https://github.com
        orgs: [oscar-organisation]
        schedule:
          frequency: { hours: 1 }
          timeout: { minutes: 5 }
