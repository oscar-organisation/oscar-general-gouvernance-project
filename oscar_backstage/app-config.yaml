# Les reglages communs du portail technique OSCAR.
#
# Backstage lit plusieurs fichiers de reglages l un apres l autre: chacun
# complete le precedent, et une valeur ecrite plus loin remplace celle d avant.
# Une liste, elle, est remplacee en entier, jamais completee.
#
#   app-config.yaml               ce fichier: ce qui vaut partout
#   app-config.developpement.yaml le mode developpement, sur le poste
#   app-config.service.yaml       le portail tel qu il tourne dans son image
#   app-config.production.yaml    en test et en production: GitHub
#   app-config.poste.yaml         sur le poste: l acces invite, le depot local
#
# Qui lit quoi:
#   test et production    app-config.yaml + service + production
#   mode service local    app-config.yaml + service + poste
#   mode developpement    app-config.yaml + developpement + poste
#
# Aucun secret n est ecrit dans ces fichiers: ce qui en est un vient d une
# variable d environnement, notee ${NOM}.

app:
  # Le nom qu on voit dans l onglet du navigateur et en tete des pages: celui
  # de la charte, et lui seul.
  title: OSCAR

  # Toutes les extensions des paquets de l interface sont chargees, sauf
  # celles qu on ferme ci-dessous.
  packages: all

  extensions:
    # La page d accueil, « Commencer ici », a la racine du portail. Ses
    # fiches: le guide du cycle, les applications qui suivent le cycle, les
    # outils de l equipe, et le deploiement. Une application de plus: une
    # ligne de plus ici.
    - page:home:
        config:
          path: /
          title: Accueil
    - home-page-layout:home/commencer-ici:
        config:
          guide: component:default/oscar-general-gouvernance-project
          # La console d administration a deux fiches, une par application
          # (son interface et son API), dans le depot oscar-console-admin.
          applications:
            - component:default/outil-dns
            - component:default/labo
            - component:default/portail
            - component:default/console-admin-interface
            - component:default/console-admin-api
          outils:
            - domain:default/oscar
            - component:default/labo
          # « Le deploiement »: comment les applications tournent sur le
          # serveur, et comment refaire le tout (decisions 83 et 84, A37).
          # Coolify y est, et plus dans les outils: une fiche ne s affiche
          # qu une fois sur la page.
          # La fiche du deploiement vit dans le depot oscar-infrastructure,
          # dossier oscar_infra_deploiement/, avec sa documentation; les
          # ressources, dans catalogue/organisation.yaml.
          # Harbor, l entrepot des images, et le reseau prive WireGuard
          # s y ajoutent a la phase 5 du plan 17 (decision 89): leurs fiches
          # vivent dans le depot oscar-infrastructure, dans leurs dossiers
          # (oscar_infra_container_registry/, oscar_infra_vpn/), chacune avec
          # sa documentation.
          deploiement:
            fiches:
              - component:default/deploiement
              - resource:default/coolify
              - resource:default/entrepot-images
              - resource:default/proxy
              - component:default/reseau-prive
              - resource:default/ovhcloud
            # Le tableau de bord de Traefik, protege par un identifiant et un
            # mot de passe. On ecrit ici le CHEMIN du fichier qui les porte,
            # sur le serveur, jamais leur valeur (R-17).
            traefik:
              adresse: https://traefik.oscar-bot.com/dashboard/
              identifiants: secret_root/acess-admin-app/traefik-tableau-de-bord/identifiants.md
              documentation:
                fiche: component:default/deploiement
                page: traefik/

    # Les titres du menu, en francais.
    - page:catalog:
        config:
          title: Catalogue
    - page:techdocs:
        config:
          title: Documentation
    - page:api-docs:
        config:
          title: API
    - page:search:
        config:
          title: Rechercher
    - page:user-settings:
        config:
          title: Réglages
    - page:catalog-graph:
        config:
          title: Graphe du catalogue
          # Le menu ne fournit pas d entite dans son adresse. Partir du domaine
          # OSCAR; une adresse venant d une fiche garde sa propre entite.
          rootEntityRefs:
            - domain:default/oscar
          maxDepth: 1

    # Ferme: ces pages n ont rien a montrer pour OSCAR aujourd hui. Un
    # element qui n apporte rien n a pas sa place a l ecran.
    #   le createur de projets: aucun modele de projet n est ecrit
    #   l import a la main: les fiches se trouvent seules, dans les depots
    #   la vue des extensions: un outil pour qui developpe le portail
    - page:scaffolder: false
    - page:catalog-import: false
    - page:app-visualizer: false

organization:
  name: OSCAR

backend:
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  # Les adresses que le portail a le droit de lire en dehors de GitHub: les
  # descriptions d API publiees par les applications elles-memes. Une adresse
  # absente d ici, et la fiche de l API reste vide, avec « Reading from ... is
  # not allowed » dans le journal du portail.
  #   api-dns            l API de l outil DNS
  #   api-console        l API de la console d administration, dont la fiche
  #                      (console-admin-api) lit la description de production
  #   test-api-console   la meme, en test, pour qu une fiche puisse la lire
  #                      sans changer ce reglage
  reading:
    allow:
      - host: api-dns.oscar-bot.com
      - host: api-console.oscar-bot.com
      - host: test-api-console.oscar-bot.com

# La documentation des depots, construite par le portail lui-meme, avec le
# MkDocs de son image (techdocs/requirements.txt), puis gardee sur place.
techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

catalog:
  # Les sortes de fiches acceptees. Les personnes et les equipes viennent de
  # l organisation GitHub (app-config.production.yaml).
  rules:
    - allow: [Component, System, Domain, API, Resource, Location, Group, User]
  # Une fiche qui n est plus lue nulle part disparait du catalogue, au lieu d y
  # rester comme une page morte. C est ce qui permet a une fiche de passer de
  # ce depot au depot de son composant sans doublon: voir
  # catalogue/en-attente/LISEZ-MOI.md.
  orphanStrategy: delete

permission:
  enabled: true
