# Le portail technique OSCAR: le portail, et sa base de donnees.
#
# Coolify lit ce fichier, et lui seul, pour deployer le test et la production.
# En local, docker compose le lit aussi, puis lui ajoute compose.override.yaml,
# qui publie les ports et ouvre l acces invite. Voir ce fichier-la.
#
# CE QUE CETTE COMPOSITION NE FAIT PAS, ET POURQUOI
#
# Elle ne publie aucun port, ne nomme aucun conteneur, n ecrit aucune regle de
# proxy et ne rejoint aucun reseau exterieur. Le proxy de Coolify joint le
# portail par le reseau de Docker, sur le port de la declaration expose, et
# pose lui-meme ses regles a partir du domaine donne a l application. Un nom de
# conteneur ou un port publie est unique sur une machine: le test et la
# production ne pourraient plus tourner cote a cote (lecon 5.4).
#
# D OU VIENNENT LES VALEURS
#
# SERVICE_URL_PORTAIL est fabriquee par Coolify lui-meme: c est l adresse
# publique du service portail, tiree du domaine donne a l application. Le test
# et la production ont donc chacun la leur, sans que personne la recopie.
#
# Les secrets, le mot de passe de la base et les identifiants de l application
# GitHub, sont poses sur l application Coolify par l assistant de deploiement,
# depuis secret_root/, un jeu par environnement. Aucun secret n est ecrit ici,
# ni dans le depot.
#
# En local, le fichier .env d a cote donne des valeurs de poste, sans secret:
# voir .env.exemple, qui explique chaque variable.
#
# AUCUNE VARIABLE N EST EXIGEE ICI: la forme « :- » avec une valeur par defaut,
# jamais la forme « :? » qui arrete tout si la variable manque
#
# Coolify construit l image avec un fichier d environnement de construction
# qui ne porte pas les secrets, poses pour l execution seulement: une
# variable exigee ici ferait echouer la construction (mesure le 26/09/2026,
# premier deploiement de portail-test). L exigence est la ou elle sert, au
# demarrage: PostgreSQL refuse de s initialiser sans mot de passe, et
# Backstage refuse de demarrer sans son adresse publique, chacun avec un
# message clair dans son journal. L outil DNS et le laboratoire font de meme.

# Le nom du deploiement. Il prefixe les conteneurs, le reseau et le volume, ce
# qui permet de lancer deux copies sur un meme poste sans qu elles se melent.
# Meme regle que l outil DNS.
name: ${OSCAR_NOM_DU_DEPLOIEMENT:-portail}

services:

  # ---------------------------------------------------------------------------
  # La base. Backstage y range son catalogue, les sessions et les cles qui les
  # signent, et la documentation deja construite. Sans elle, tout repart de
  # zero a chaque redemarrage, et tout le monde est deconnecte.
  # ---------------------------------------------------------------------------
  base:
    # Version figee: une nouvelle version majeure de PostgreSQL ne relit pas les
    # donnees de l ancienne sans migration, ca se decide.
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_UTILISATEUR:-backstage}"
      POSTGRES_PASSWORD: "${POSTGRES_MOT_DE_PASSE:-}"
      POSTGRES_DB: backstage
    volumes:
      # Un volume nomme, et pas un dossier de la machine: les donnees survivent
      # a la mise a jour des images, et se sauvegardent d une seule commande.
      - base-du-portail:/var/lib/postgresql/data
    healthcheck:
      # pg_isready dit si la base accepte les connexions, pas seulement si le
      # conteneur tourne. Le portail attend ce feu vert pour demarrer.
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname backstage"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped
    networks:
      - reseau-du-portail

  # ---------------------------------------------------------------------------
  # Le portail lui-meme.
  # ---------------------------------------------------------------------------
  portail:
    build:
      # Le contexte est ce dossier: tout ce qui concerne le portail y vit, ce
      # qui permet a Coolify de ne viser que lui (decision 62).
      context: .
      target: execution
    depends_on:
      base:
        condition: service_healthy
    environment:
      # L adresse publique. Elle fabrique les liens, et l adresse de retour de
      # la connexion GitHub: une valeur fausse donne une connexion qui tourne en
      # rond sans message clair.
      OSCAR_PORTAIL_URL: "${SERVICE_URL_PORTAIL:-}"

      POSTGRES_HOST: base
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_UTILISATEUR:-backstage}"
      POSTGRES_PASSWORD: "${POSTGRES_MOT_DE_PASSE:-}"

      # L application GitHub du portail: la connexion des personnes, et la
      # lecture de l organisation. Vides en local, ou le portail s ouvre en
      # invite et ne lit pas GitHub. En test et en production, le portail
      # refuse de demarrer si l une manque: Backstage exige ces reglages.
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      # La cle privee, sur plusieurs lignes. Coolify la garde comme une
      # variable a plusieurs lignes, et la transmet entiere.
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
    # Le port sur lequel le portail ecoute DANS son conteneur. Il ne sort pas
    # sur la machine: c est ce que le proxy lit pour savoir ou envoyer les
    # visiteurs.
    expose:
      - "7007"
    healthcheck:
      # La route de disponibilite de Backstage: 200 seulement quand le serveur a
      # fini de demarrer et que tous ses modules sont prets, 503 sinon.
      # L ancienne route, /healthcheck, n existait pas et le controle passait
      # toujours (lecon 3.7). Node fait la requete: pas besoin de curl.
      test: ["CMD", "node", "-e", "fetch('http://localhost:7007/.backstage/health/v1/readiness').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      # Backstage met une a deux minutes a demarrer: le catalogue, la recherche
      # et la documentation s initialisent avant de se dire prets.
      start_period: 180s
      retries: 5
    restart: unless-stopped
    networks:
      - reseau-du-portail

volumes:
  base-du-portail:

networks:
  reseau-du-portail:
