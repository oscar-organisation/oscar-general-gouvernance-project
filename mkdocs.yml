# La documentation de ce depot, telle que TechDocs, le lecteur de
# documentation du portail Backstage, la construit.
#
# Le portail la trouve par catalog-info.yaml, a la racine du depot, dont
# l annotation backstage.io/techdocs-ref vaut dir:. : ce fichier-ci, et les
# pages du dossier docs/.
#
# Seules des cles que TechDocs accepte sont employees ici: il efface les
# autres avant de construire, et une page qui marcherait en local ne marcherait
# plus dans le portail.
#
# Pour construire et verifier en local, dans un conteneur:
#   docker compose -f docs/outils/compose.yaml run --rm construire

site_name: OSCAR, le cycle de développement
site_description: >-
  Le guide commun du cycle de développement des applications OSCAR: du poste du
  développeur jusqu'à la production, en passant par le test.
repo_url: https://github.com/oscar-organisation/oscar-general-gouvernance-project
edit_uri: edit/main/docs/
docs_dir: docs

nav:
  - Commencer ici: README.md
  - Comment une modification arrive en production: 01-comment-une-modification-arrive-en-production.md
  - Le cycle pas à pas: 02-le-cycle-pas-a-pas.md
  - Comment se comporter: 03-comment-se-comporter.md
  - Les environnements: 04-les-environnements.md
  - Les vérifications automatiques: 05-les-verifications-automatiques.md
  - Un workflow par sous-projet: 05-un-workflow-par-sous-projet.md
  - Le code et l'exploitation: 06-le-code-et-l-exploitation.md
  - Surveiller: 07-surveiller.md
  - Les applications:
      - Les applications: 08-les-applications/README.md
      - Outil DNS: 08-les-applications/outil-dns.md
      - Laboratoire de tests: 08-les-applications/laboratoire.md
      - Portail Backstage: 08-les-applications/portail-backstage.md
      - Console d'administration: 08-les-applications/console-admin.md
  - Glossaire: 09-glossaire.md
  - Les schémas: schemas/README.md

# Hors du site:
#   evolutions/  les rapports des lots du plan, lus sur GitHub; ce ne sont pas
#                des pages du guide
#   outils/      la composition et le script qui fabriquent les schemas et
#                construisent le guide
exclude_docs: |
  /evolutions/
  /outils/

# Un lien casse, une ancre absente, une page oubliee dans le menu: chacun est
# un avertissement, et la construction en mode strict echoue dessus.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - techdocs-core
