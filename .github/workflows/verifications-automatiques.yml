# Les vérifications automatiques de GitHub pour le dépôt
# oscar-general-gouvernance-project, au patron commun des trois dépôts.
#
#   verifications_rapides  lignes d'attribution, secrets, fichiers d'environnement,
#                          typographie, fichiers des workflows, compositions lues comme
#                          Coolify, et la construction du guide (décision 98)
#   deploiement            le déploiement automatique commun par image de Harbor:
#                          à chaque PR et à chaque envoi, les tests du code (l'étape
#                          « verifications » du Dockerfile); à l'envoi sur test, l'image du
#                          portail construite une seule fois, son contenu contrôlé, rangée
#                          dans Harbor (oscar/portail-portail) puis mise en ligne en test;
#                          à l'envoi sur main, LA MÊME en production, sans rien reconstruire;
#                          pour une PR de test vers main, la vérification que l'image testée
#                          existe
#   resume                 un résumé de l'exécution, et un seul commentaire dans la PR
#
# Chaque tâche attend la précédente: une tâche en échec arrête les suivantes, et rien
# n'est mis en ligne. Une PR ne met jamais rien en ligne.
#
# Ne sont plus lancés ici (décision 91), et restent des outils du développeur, lancés à
# la main (oscar_backstage/LISEZ-MOI.md): les schémas du guide, les images de marque et
# les tests de leur générateur, les tests du contrôle à l'écran, les tests de l'accueil
# et de la charte.
#
# Les ordinateurs de GitHub qui font les vérifications sont fixés sur ubuntu-24.04, et
# non sur ubuntu-latest, que GitHub fait passer à Ubuntu 26 le 19/10/2026: les
# vérifications automatiques doivent donner le même résultat d'une semaine à l'autre, et
# un changement de version se décide et s'éprouve (décision A38).
name: Vérifications automatiques

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

# Par défaut, une exécution ne fait que lire. Le déploiement demande en plus le droit de
# déclarer ses déploiements, et le résumé celui d'écrire son commentaire dans la PR.
permissions:
  contents: read

env:
  # Le dossier du portail dans le dépôt. Tout le portail y vit (décision 62).
  # Son nom n'est écrit qu'ici pour les étapes de ce fichier.
  PORTAIL: oscar_backstage

jobs:

  verifications_rapides:
    name: Vérifications rapides
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique complet: le contrôle des messages de commit doit
          # pouvoir dire quels commits l'exécution apporte.
          fetch-depth: 0

      - name: Aucune ligne d'attribution dans les commits
        # La règle A18, écrite une fois, avec ses tests, dans une action du
        # dépôt oscar-infrastructure.
        uses: oscar-organisation/oscar-infrastructure/.github/actions/controler-les-commits@main

      - name: Chercher des motifs de secrets
        run: |
          set -u
          motifs='github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if grep -rInE "$motifs" . --exclude-dir=.git --exclude-dir=node_modules ; then
            echo "::error::Un secret semble présent dans le dépôt."
            exit 1
          fi
          echo "Aucun motif de secret trouvé."

      - name: Chaque fichier d'environnement a son exemple, identique
        run: |
          # Décision 46: les fichiers .env sont versionnés pendant le
          # développement. Celui du portail est une copie à l'identique de son
          # .env.exemple, qui explique chaque réglage.
          set -u
          manque=0
          for f in $(git ls-files | grep -E '(^|/)\.env$') ; do
            d=$(dirname "$f")
            if [ ! -f "$d/.env.exemple" ] ; then
              echo "::error::$f n'a pas de fichier d'exemple à côté."
              manque=1
            fi
          done
          cmp "$PORTAIL/.env" "$PORTAIL/.env.exemple" || { echo "::error::$PORTAIL/.env n'est plus la copie de .env.exemple."; manque=1; }
          [ "$manque" = "0" ]

      - name: Typographie, pas de caractère interdit
        run: |
          set -u
          # Les motifs sont écrits en hexadécimal pour que ce fichier ne
          # contienne pas lui-même les caractères qu'il interdit.
          if grep -rInP '\x{2014}|\x{2026}' \
               --include='*.md' --include='*.ts' --include='*.tsx' --include='*.js' \
               --include='*.css' --include='*.yml' --include='*.yaml' --include='*.json' \
               --include='*.py' --include='*.sh' --include='*.mmd' --include='Dockerfile' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude=yarn.lock . ; then
            echo "::error::Caractère interdit trouvé. Utiliser le tiret simple et trois points."
            exit 1
          fi
          echo "Typographie conforme."

      - name: Les fichiers des vérifications automatiques sont valides
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Les ordinateurs de GitHub qui font les vérifications sont fixés sur une version
        # Décision A38: les vérifications automatiques donnent le même résultat
        # d'une semaine à l'autre. Un nom qui bouge, comme ubuntu-latest (Ubuntu 26
        # à partir du 19/10/2026), changerait le système sans que rien ne change
        # chez nous. Toutes les tâches tournent donc sur une version nommée, la
        # même partout: on en change dans une PR à part, pour toutes les tâches à
        # la fois, une fois les vérifications automatiques réussies.
        # La version n'est écrite qu'aux lignes runs-on, pas ici.
        run: |
          set -u
          # Les machines nommées aux lignes runs-on, une par ligne, puis sur une seule ligne.
          machines=$(sed -nE 's/^[[:space:]]+runs-on:[[:space:]]*//p' .github/workflows/*.yml | sort -u)
          liste=$(printf '%s\n' "$machines" | paste -sd ' ' -)
          if [ -z "$machines" ] ; then
            echo "::error::Aucune ligne runs-on lue dans .github/workflows: le contrôle ne voit rien."
            exit 1
          fi
          if printf '%s\n' "$machines" | grep -q -- '-latest' ; then
            echo "::error::Une tâche tourne sur une machine qui change seule ($liste). La nommer, par exemple ubuntu-24.04 (décision A38)."
            exit 1
          fi
          if [ "$(printf '%s\n' "$machines" | wc -l)" -ne 1 ] ; then
            echo "::error::Les tâches ne tournent pas toutes sur la même machine ($liste). En changer pour toutes à la fois (décision A38)."
            exit 1
          fi
          echo "Toutes les tâches tournent sur $liste."

      - name: Les compositions sont valides
        run: |
          set -eu
          # Le portail, tel que Coolify le lit (-f, sans le complément) et tel
          # qu'on le lance en local (avec le complément).
          ( cd "$PORTAIL" && docker compose -f compose.yaml config --quiet && docker compose config --quiet )
          # Telle que Coolify la lit pour construire: avec un fichier
          # d environnement de construction qui ne porte aucun secret. Une
          # variable exigee (forme « :? ») y fait echouer la construction.
          ( cd "$PORTAIL" && docker compose --env-file /dev/null -f compose.yaml config --quiet )
          # Coolify ne doit voir aucun port publié.
          if ( cd "$PORTAIL" && docker compose -f compose.yaml config ) | grep -q 'published:' ; then
            echo "::error::$PORTAIL/compose.yaml publie un port: il va dans compose.override.yaml."
            exit 1
          fi
          docker compose -f docs/outils/compose.yaml config --quiet
          docker compose -f "$PORTAIL/marque/compose.yaml" config --quiet
          docker compose -f "$PORTAIL/verifications-ecran/compose.yaml" config --quiet
          echo "Compositions valides."

      - name: Le guide se construit, sans aucun avertissement
        # Le guide du cycle, lu par le portail sur GitHub (décision 98): un lien cassé,
        # une page oubliée ou une ancre absente arrêtent tout.
        run: docker compose -f docs/outils/compose.yaml run --rm construire

  deploiement:
    name: Tests du code, puis construire, ranger et mettre en ligne
    # Après les vérifications rapides (leçon 5.1): une vérification en échec ne met rien
    # en ligne.
    needs: verifications_rapides
    permissions:
      contents: read
      deployments: write
    uses: oscar-organisation/oscar-infrastructure/.github/workflows/deploiement-par-image-harbor.yml@main
    with:
      # Les applications Coolify portail-test et portail-production, et les
      # environnements GitHub du même nom, où vit COOLIFY_APPLICATION (A2).
      application: portail
      # Le dépôt d'images oscar/portail-portail: l'application, puis le service de la
      # composition (conventions de la phase 3 du plan 17).
      nom_des_images: portail
      dossier: oscar_backstage
      # Le seul service construit; la base est l'image publique postgres.
      services: portail
      # Ce qui n'entre pas dans l'empreinte du contenu: la documentation et les fiches du
      # catalogue (la règle commune), et les deux outils du développeur, qui n'entrent
      # pas dans l'image. Les modifier ne reconstruit ni ne remet en ligne le portail.
      ignorer: |
        *.md
        catalog-info.yaml
        marque/
        verifications-ecran/
      # Les tests du code: l'étape « verifications » du Dockerfile (yarn tsc, le paquet du
      # serveur, puis tous les tests), avec le cache de GitHub qu'elle partage avec
      # l'image.
      cible_des_tests: verifications
      service_des_tests: portail
      # Le contenu de l'image exacte qui sera rangée (leçon 3.4): les réglages du poste
      # absents, ceux de la production, le catalogue et MkDocs présents.
      controles_des_images: |
        portail: ./controler-l-image.sh "$IMAGE_A_CONTROLER"
      site_test: https://test-tech.oscar-bot.com
      site_production: https://tech.oscar-bot.com
      # La route de disponibilité de Backstage: 200 seulement quand tous ses modules sont
      # prêts (leçon 3.7).
      sante_test: https://test-tech.oscar-bot.com/.backstage/health/v1/readiness
      sante_production: https://tech.oscar-bot.com/.backstage/health/v1/readiness
      # Backstage met une à deux minutes à se dire prêt (start_period de 180 s dans la
      # composition): dix minutes laissent plus de trois fois ce temps.
      attente_de_la_sante: "600"
    secrets:
      coolify_jeton: ${{ secrets.COOLIFY_JETON }}
      harbor_compte_envoi_nom: ${{ secrets.HARBOR_COMPTE_ENVOI_NOM }}
      harbor_compte_envoi_secret: ${{ secrets.HARBOR_COMPTE_ENVOI_SECRET }}

  resume:
    name: Résumé
    # Toujours, même quand une tâche échoue: le résumé dit alors ce qui a échoué et que
    # rien n'a été mis en ligne.
    if: always()
    needs: [verifications_rapides, deploiement]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Écrire le résumé, et le commentaire de la PR
        uses: oscar-organisation/oscar-infrastructure/.github/actions/deploiement-par-image-harbor@main
        with:
          etape: resumer
          taches: ${{ toJSON(needs) }}
          numero_de_la_pr: ${{ github.event.pull_request.number }}
          jeton_github: ${{ github.token }}
