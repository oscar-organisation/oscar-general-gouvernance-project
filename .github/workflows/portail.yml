# Le workflow du portail Backstage, le sous-projet du dossier oscar_backstage/.
#
# Ce qu'il vérifie et fait:
#   verifications_rapides  le fichier d'environnement du portail est la copie de son
#                          exemple, et ses compositions sont valides, lues comme
#                          Coolify les lit, sans port publié
#   deploiement            le déploiement automatique commun par image de Harbor:
#                          à chaque PR et à chaque envoi, les tests du code (l'étape
#                          « verifications » du Dockerfile); à l'envoi sur test, l'image du
#                          portail construite une seule fois, son contenu contrôlé, rangée
#                          dans Harbor (oscar/portail-portail) puis mise en ligne en test;
#                          à l'envoi sur main, LA MÊME en production, sans rien reconstruire;
#                          pour une PR de test vers main, la vérification que l'image testée
#                          existe
#   resume                 un résumé de l'exécution, et un commentaire dans la PR titré
#                          « Portail: le résumé »
#
# Chaque tâche attend la précédente: une tâche en échec arrête les suivantes, et rien
# n'est mis en ligne. Une PR ne met jamais rien en ligne.
#
# Quand il se lance: pour une PR vers test ou main et pour un envoi sur test ou main,
# seulement s'ils modifient le dossier du portail ou ce fichier-ci; et à la main
# (« Run workflow » sur la page Actions, branche test ou main), par exemple pour
# relancer une mise en ligne en échec qu'aucun envoi suivant ne touche.
#
# Pourquoi: depuis le 05/10/2026 (décisions 124 et 125), chaque sous-projet du dépôt a
# son propre workflow. Un envoi qui ne modifie que le guide ne vérifie ni ne remet en
# ligne le portail, et ce fichier se modifie sans toucher aux autres. Les vérifications
# communes à tout le dépôt (attribution, secrets, typographie...) sont dans
# verifications-communes.yml, qui se lance à chaque fois, à côté de celui-ci.
#
# Une modification de la seule documentation du dossier lance aussi ce workflow (sa
# documentation fait partie du sous-projet); le déploiement dit alors « déjà en ligne »,
# parce que l'empreinte du contenu ignore les *.md: rien n'est reconstruit.
#
# Ne sont pas lancés ici (décision 91), et restent des outils du développeur, lancés à
# la main (oscar_backstage/LISEZ-MOI.md): les images de marque et les tests de leur
# générateur, les tests du contrôle à l'écran, les tests de l'accueil et de la charte.
#
# Le détacher un jour dans son propre dépôt: le dossier oscar_backstage/ devient la
# racine du nouveau dépôt, ce fichier y part aussi; le dossier s'y écrit « . » (variable
# DOSSIER et entrée dossier du déploiement), .github/ s'ajoute à ignorer (l'empreinte
# prend alors tout le dépôt) et le filtre de chemins disparaît. Le reste
# (vérifications communes, environnements et secrets de GitHub, descriptions Coolify) est
# dans la page « Un workflow par sous-projet » du guide.
name: Portail

on:
  # Le filtre de chemins répète le nom du dossier écrit dans DOSSIER plus bas: GitHub
  # n'accepte pas de variable à cet endroit. Le portail ne lit aucun fichier hors de son
  # dossier: aucun fichier partagé n'est ajouté ici.
  push:
    branches: [test, main]
    paths:
      - 'oscar_backstage/**'
      - '.github/workflows/portail.yml'
  pull_request:
    branches: [test, main]
    paths:
      - 'oscar_backstage/**'
      - '.github/workflows/portail.yml'
  workflow_dispatch:

# Par défaut, une exécution ne fait que lire. Le déploiement demande en plus le droit de
# déclarer ses déploiements, et le résumé celui d'écrire son commentaire dans la PR.
permissions:
  contents: read

env:
  # Le dossier du portail dans le dépôt. Tout le portail y vit (décision 62).
  # Toutes les étapes de ce fichier le lisent ici.
  DOSSIER: oscar_backstage

jobs:

  verifications_rapides:
    name: Vérifications rapides
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Le fichier d'environnement du portail est la copie de son exemple
        run: |
          # Décision 46: le .env du portail est versionné, copie à l'identique de son
          # .env.exemple, qui explique chaque réglage. Que chaque .env du dépôt ait
          # son exemple est vérifié dans verifications-communes.yml.
          set -u
          cmp "$DOSSIER/.env" "$DOSSIER/.env.exemple" || { echo "::error::$DOSSIER/.env n'est plus la copie de .env.exemple."; exit 1; }

      - name: Les compositions sont valides
        run: |
          set -eu
          # Le portail, tel que Coolify le lit (-f, sans le complément) et tel
          # qu'on le lance en local (avec le complément).
          ( cd "$DOSSIER" && docker compose -f compose.yaml config --quiet && docker compose config --quiet )
          # Telle que Coolify la lit pour construire: avec un fichier
          # d environnement de construction qui ne porte aucun secret. Une
          # variable exigee (forme « :? ») y fait echouer la construction.
          ( cd "$DOSSIER" && docker compose --env-file /dev/null -f compose.yaml config --quiet )
          # Coolify ne doit voir aucun port publié.
          if ( cd "$DOSSIER" && docker compose -f compose.yaml config ) | grep -q 'published:' ; then
            echo "::error::$DOSSIER/compose.yaml publie un port: il va dans compose.override.yaml."
            exit 1
          fi
          # Les deux outils du développeur, rangés dans le dossier du portail.
          docker compose -f "$DOSSIER/marque/compose.yaml" config --quiet
          docker compose -f "$DOSSIER/verifications-ecran/compose.yaml" config --quiet
          echo "Compositions valides."

  deploiement:
    name: Tests du code, puis construire, ranger et mettre en ligne
    # Après les vérifications rapides (leçon 5.1): une vérification en échec ne met rien
    # en ligne.
    needs: verifications_rapides
    permissions:
      contents: read
      deployments: write
    uses: oscar-organisation/oscar-infrastructure/.github/workflows/deploiement-par-image-harbor.yml@main
    with:
      # Les applications Coolify portail-test et portail-production, et les
      # environnements GitHub du même nom, où vit COOLIFY_APPLICATION (A2).
      application: portail
      # Le dépôt d'images oscar/portail-portail: l'application, puis le service de la
      # composition (conventions de la phase 3 du plan 17).
      nom_des_images: portail
      # Le même dossier que DOSSIER, répété ici: un workflow appelé ne lit pas env.
      dossier: oscar_backstage
      # Le seul service construit; la base est l'image publique postgres.
      services: portail
      # Ce qui n'entre pas dans l'empreinte du contenu: la documentation et les fiches du
      # catalogue (la règle commune), et les deux outils du développeur, qui n'entrent
      # pas dans l'image. Les modifier ne reconstruit ni ne remet en ligne le portail.
      ignorer: |
        *.md
        catalog-info.yaml
        marque/
        verifications-ecran/
      # Les tests du code: l'étape « verifications » du Dockerfile (yarn tsc, le paquet du
      # serveur, puis tous les tests), avec le cache de GitHub qu'elle partage avec
      # l'image.
      cible_des_tests: verifications
      service_des_tests: portail
      # Le contenu de l'image exacte qui sera rangée (leçon 3.4): les réglages du poste
      # absents, ceux de la production, le catalogue et MkDocs présents.
      controles_des_images: |
        portail: ./controler-l-image.sh "$IMAGE_A_CONTROLER"
      site_test: https://test-tech.oscar-bot.com
      site_production: https://tech.oscar-bot.com
      # La route de disponibilité de Backstage: 200 seulement quand tous ses modules sont
      # prêts (leçon 3.7).
      sante_test: https://test-tech.oscar-bot.com/.backstage/health/v1/readiness
      sante_production: https://tech.oscar-bot.com/.backstage/health/v1/readiness
      # Backstage met une à deux minutes à se dire prêt (start_period de 180 s dans la
      # composition): dix minutes laissent plus de trois fois ce temps.
      attente_de_la_sante: "600"
    secrets:
      coolify_jeton: ${{ secrets.COOLIFY_JETON }}
      harbor_compte_envoi_nom: ${{ secrets.HARBOR_COMPTE_ENVOI_NOM }}
      harbor_compte_envoi_secret: ${{ secrets.HARBOR_COMPTE_ENVOI_SECRET }}

  resume:
    name: Résumé
    # Toujours, même quand une tâche échoue: le résumé dit alors ce qui a échoué et que
    # rien n'a été mis en ligne.
    if: always()
    needs: [verifications_rapides, deploiement]
    runs-on: ubuntu-24.04
    # Lire le début de l'exécution (sa durée, dans le résumé) demande actions: read;
    # sans lui, l'API répond 403 « Resource not accessible by integration » (vu sur la
    # première exécution de la PR 34). Écrire le commentaire demande pull-requests: write.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Écrire le résumé, et le commentaire de la PR
        uses: oscar-organisation/oscar-infrastructure/.github/actions/deploiement-par-image-harbor@main
        with:
          etape: resumer
          taches: ${{ toJSON(needs) }}
          numero_de_la_pr: ${{ github.event.pull_request.number }}
          jeton_github: ${{ github.token }}
